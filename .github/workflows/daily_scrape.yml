name: Daily DVC Market Snapshot

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC ≈ 5am ET
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # scrape_all.py and build_dashboard.py are standard library only.
      # No install step means no dependency to break silently.

      - name: Stamp date
        run: echo "SNAP_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Scrape all listings
        run: python scrape_all.py

      - name: Rebuild dashboard
        run: python build_dashboard.py

      - name: Commit snapshot
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/listings_history.csv index.html summary.txt
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Market snapshot $SNAP_DATE"
            git push
          fi

      - name: Email the dashboard
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: DVC Market Observer
          to: ${{ secrets.MY_EMAIL }}
          subject: "DVC market snapshot — ${{ env.SNAP_DATE }}"
          body: file://summary.txt
          attachments: index.html
